<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>山川笔记</title>
  <style>
    :root {
      --background: #f8f8f5;
      --surface: #ffffff;
      --text: #1e293b;
      --muted: #64748b;
      --accent: #0f766e;
      --border: #dce3e5;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--background);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        "Microsoft YaHei", sans-serif;
      line-height: 1.8;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .container {
      width: min(920px, calc(100% - 40px));
      margin: 0 auto;
    }

    header {
      border-bottom: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.9);
    }

    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 74px;
      gap: 24px;
    }

    .brand {
      font-size: 20px;
      font-weight: 700;
    }

    nav {
      display: flex;
      gap: 20px;
    }

    nav a {
      color: var(--muted);
    }

    nav a:hover,
    .post-title a:hover {
      color: var(--accent);
    }

    main {
      padding: 52px 0 72px;
    }

    .intro {
      margin-bottom: 38px;
    }

    .intro h1 {
      margin: 0 0 8px;
      font-size: 32px;
      line-height: 1.3;
    }

    .intro p {
      margin: 0;
      color: var(--muted);
    }

    .post-list {
      display: grid;
      gap: 16px;
    }

    .post-card {
      padding: 24px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
    }

    .post-meta {
      color: var(--muted);
      font-size: 14px;
    }

    .category {
      color: var(--accent);
      font-weight: 600;
    }

    .post-title {
      margin: 7px 0 10px;
      font-size: 23px;
      line-height: 1.4;
    }

    .post-excerpt {
      margin: 0;
      color: #475569;
    }

    footer {
      padding: 28px 0;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: 14px;
    }

    @media (max-width: 600px) {
      .header-inner {
        min-height: 64px;
      }

      .intro h1 {
        font-size: 28px;
      }

      .post-card {
        padding: 20px;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="container header-inner">
      <a class="brand" href="index.html">山川笔记</a>
      <nav>
        <a href="index.html">文章</a>
        <a href="#about">关于</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="intro">
      <h1>山川笔记</h1>
      <p>记录技术、阅读与日常思考。</p>
    </section>

    <section class="post-list">
      <article class="post-card">
        <div class="post-meta">
          <span class="category">技术</span> ·
          <time datetime="2026-09-06">2026-09-06</time>
        </div>
        <h2 class="post-title">
          <a href="build-a-static-blog-with-html.html">用 HTML 搭建一个静态博客</a>
        </h2>
        <p class="post-excerpt">
          不使用数据库和后端程序，只使用 HTML 和 CSS 即可构建一个可部署的个人博客。
        </p>
      </article>

      <article class="post-card">
        <div class="post-meta">
          <span class="category">阅读</span> ·
          <time datetime="2026-08-28">2026-08-28</time>
        </div>
        <h2 class="post-title">
          <a href="reading-notes.html">阅读笔记：把知识变成自己的系统</a>
        </h2>
        <p class="post-excerpt">
          阅读的价值不止于记住内容，更在于建立能反复调用的思考框架。
        </p>
      </article>

      <article class="post-card">
        <div class="post-meta">
          <span class="category">生活</span> ·
          <time datetime="2026-08-20">2026-08-20</time>
        </div>
        <h2 class="post-title">
          <a href="weekly-review.html">每周复盘的三个问题</a>
        </h2>
        <p class="post-excerpt">
          用固定问题回顾一周，可以让时间投入变得更清晰。
        </p>
      </article>
    </section>
  </main>

  <footer id="about">
    <div class="container">
      &copy; 2026 山川笔记
    </div>
  </footer>
</body>
</html>
